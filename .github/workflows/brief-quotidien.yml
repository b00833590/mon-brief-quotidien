name: Brief quotidien automatique

# GitHub ne garantit pas l'heure exacte d'un declenchement `schedule` — des
# retards de plusieurs heures sont possibles (constate le 26-28/07/2026 : des
# cron programmes vers 8h/13h Paris se sont executes jusqu'a 10h plus tard,
# ratant systematiquement la fenetre stricte "il est exactement 8h ou 13h").
#
# Plutot que de viser une heure precise et rater le cycle du jour en cas de
# retard, le workflow se declenche toutes les 30 min sur une large plage
# (6h-20h59 UTC, couvre 7h/8h a 21h/22h Paris ete/hiver). La verification
# d'idempotence ne se base plus sur "combien de minutes depuis le dernier
# commit" mais sur "un cycle a-t-il deja tourne aujourd'hui (heure Paris)
# pour ce creneau (matin = avant 12h, apres-midi = a partir de 12h) ?" —
# robuste a un retard de plusieurs heures, se rattrape tout seul dans la
# journee au lieu de rester silencieusement en panne jusqu'au lendemain.
#
# Incident du 29/07/2026 : constate que `schedule` peut aussi ne PAS se
# declencher du tout (pas juste en retard) — zero run entre 21h43 UTC le
# 28/07 et 08h12 UTC le 29/07, alors que 5 creneaux auraient du partir. Cas
# que l'idempotence par creneau ne peut pas corriger puisqu'il ne s'agit pas
# d'un retard mais d'une absence totale de declenchement cote GitHub (limite
# connue et documentee de `schedule`, non garantie par GitHub). Palliatif :
# un cron externe (cron-job.org) appelle `workflow_dispatch` (sans `force`)
# toutes les 30 min sur la meme plage, en s'appuyant sur une horloge
# independante de celle de GitHub — voir RUNBOOK.md pour la config exacte.
# `schedule` reste actif en parallele (filet de secours si jamais le service
# externe tombe en panne a son tour) ; les deux partagent la meme verification
# d'idempotence donc aucun risque de double execution/double quota.
on:
  schedule:
    - cron: '*/30 6-20 * * *'
  workflow_dispatch:   # permet de lancer manuellement depuis l'onglet Actions, ou via un cron externe (voir RUNBOOK.md)
    inputs:
      force:
        description: "Forcer l'execution meme si un cycle a deja tourne aujourd'hui pour ce creneau"
        required: false
        default: false
        type: boolean

# Empeche deux executions de se chevaucher (declenchement manuel pile au
# moment d'un creneau planifie) : la plus recente annule celle en cours
# plutot que de risquer deux push Git concurrents.
concurrency:
  group: brief-quotidien
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth par defaut (1) ne recupererait que HEAD : l'etape
          # suivante a besoin de chercher en arriere le dernier commit de
          # cycle automatique, qui peut ne pas etre HEAD (commit humain
          # intercale entretemps).
          fetch-depth: 50

      - name: Verifier si un cycle a deja tourne pour ce creneau aujourd'hui
        id: idempotence
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "Declenchement manuel force (force=true) : execution forcee."
            echo "deja_fait=non" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DATE_PARIS=$(TZ='Europe/Paris' date +%d/%m/%Y)
          HEURE_PARIS=$(TZ='Europe/Paris' date +%H)
          if [ "$HEURE_PARIS" -lt 12 ]; then
            CRENEAU="matin"
          else
            CRENEAU="apres-midi"
          fi
          echo "Aujourd'hui (Paris) : ${DATE_PARIS}, creneau ${CRENEAU} (${HEURE_PARIS}h locales)"

          # Cherche le commit de cycle automatique le plus recent dans tout
          # l'historique (pas juste HEAD) : un commit humain intercale (doc,
          # ajustement du workflow...) ne doit pas faire croire a tort qu'aucun
          # cycle n'a encore tourne aujourd'hui.
          DERNIER_MSG=$(git log -1 --grep='^Mise a jour automatique du' --format=%s || true)
          echo "Dernier commit de cycle automatique : ${DERNIER_MSG:-<aucun>}"

          # On lit la date/heure de ce commit via le timestamp Git (epoch +
          # offset), converti en heure Paris avec --date=format-local, plutot que
          # de parser l'heure ecrite dans le message. Le message est produit par
          # `datetime.now()` sans fuseau dans gmail_test.py, donc en heure UTC du
          # runner — un parsing textuel aurait donc mal classe matin/apres-midi
          # pres de la frontiere (ex. "10:46" dans le message = 12:46 Paris l'ete).
          if [ -n "$DERNIER_MSG" ]; then
            DERNIER_DATE=$(TZ='Europe/Paris' git log -1 --grep='^Mise a jour automatique du' --date='format-local:%d/%m/%Y' --format=%cd)
            DERNIER_HEURE=$(TZ='Europe/Paris' git log -1 --grep='^Mise a jour automatique du' --date='format-local:%H' --format=%cd)
            if [ "$DERNIER_HEURE" -lt 12 ]; then
              DERNIER_CRENEAU="matin"
            else
              DERNIER_CRENEAU="apres-midi"
            fi
            echo "Dernier commit (converti heure Paris) : ${DERNIER_DATE} ${DERNIER_HEURE}h, creneau ${DERNIER_CRENEAU}"
            if [ "$DERNIER_DATE" = "$DATE_PARIS" ] && [ "$DERNIER_CRENEAU" = "$CRENEAU" ]; then
              echo "Cycle deja effectue aujourd'hui pour le creneau ${CRENEAU} — on saute ce run."
              echo "deja_fait=oui" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Aucun cycle ${CRENEAU} encore effectue aujourd'hui — on lance le pipeline."
          echo "deja_fait=non" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.idempotence.outputs.deja_fait != 'oui'
        with:
          python-version: '3.12'

      - name: Installer les dependances Python
        if: steps.idempotence.outputs.deja_fait != 'oui'
        run: pip install -r requirements.txt

      - name: Installer Playwright (Chromium headless, pour le scraping Natixis)
        if: steps.idempotence.outputs.deja_fait != 'oui'
        run: playwright install --with-deps chromium

      - name: Restaurer le token Gmail depuis le secret GitHub
        if: steps.idempotence.outputs.deja_fait != 'oui'
        run: printf '%s' '${{ secrets.GMAIL_TOKEN_JSON }}' > token.json

      - name: Configurer l'identite git pour le commit automatique
        if: steps.idempotence.outputs.deja_fait != 'oui'
        run: |
          git config user.name "mon-brief-quotidien-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Lancer le pipeline (scraping, Gemini, rendu HTML, push)
        if: steps.idempotence.outputs.deja_fait != 'oui'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gmail_test.py
